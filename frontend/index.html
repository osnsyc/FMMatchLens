    <meta name="description" content="FMMatchLens - Local match analytics dashboard for Football Manager 2026" />
    <script>
      (() => {
        const key = "fmmatchlens.appearance.v1"
        const known = {
          fm: ["light", "dark"],
          "opta-inspired": ["light", "dark"],
          "wyscout-inspired": ["light"],
        }
        const defaults = { presetId: "fm", schemePreference: "dark", colorVision: "standard", contrast: "normal" }
        let stored = {}
        try { stored = JSON.parse(localStorage.getItem(key) || "{}") || {} } catch { stored = {} }
        const legacy = localStorage.getItem("theme")
        const presetId = typeof stored.presetId === "string" && known[stored.presetId] ? stored.presetId : defaults.presetId
        const preference = ["system", "light", "dark"].includes(stored.schemePreference)
          ? stored.schemePreference
          : (["system", "light", "dark"].includes(legacy) ? legacy : defaults.schemePreference)
        const system = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
        const wanted = preference === "system" ? system : preference
        const scheme = known[presetId].includes(wanted) ? wanted : known[presetId][0]
        const colorVision = ["standard", "colorblind"].includes(stored.colorVision) ? stored.colorVision : defaults.colorVision
        const contrast = ["normal", "high"].includes(stored.contrast) ? stored.contrast : defaults.contrast
        const root = document.documentElement
        root.dataset.preset = presetId
        root.dataset.scheme = scheme
        root.dataset.colorVision = colorVision
        root.dataset.contrast = contrast
        root.className = scheme
        root.style.colorScheme = scheme
      })()
    </script>
    <title>FMMatchLens</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
