name: Release preview

# Hosted runners lack game interop references. Formal publication is local and
# requires exact Windows-tested binary hashes (scripts/package-release.py --publish).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build a preview for
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preview:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate tag and product versions
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [xml]$props = Get-Content Directory.Build.props -Raw
          $version = [string]$props.Project.PropertyGroup.ProjectVersion
          if ($env:REQUESTED_TAG -ne "v$version") { throw "Tag does not match product version" }
          if ((node -p "require('./frontend/package.json').version") -ne $version -or
              (node -p "require('./frontend/package-lock.json').version") -ne $version) {
            throw "Frontend version does not match product version"
          }
      - name: Prepare pinned BepInEx dependencies
        shell: pwsh
        run: ./.github/scripts/prepare-plugin-dependencies.ps1
      - name: Build capture-only preview
        run: dotnet build src/FMMatchLens.Plugin/FMMatchLens.Plugin.csproj -c Release -p:EnableUnityIntegration=false
      - name: Validate managed SDK and packaging
        run: |
          dotnet test tests/FMMatchLens.Sdk.Tests -c Release
          python -m unittest discover -s tests/packaging -v
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Validate frontend
        working-directory: frontend
        run: |
          npm run lint
          npm test
          npm run build
      - name: Package clearly marked preview (no GitHub release publication)
        run: python scripts/package-release.py
      - uses: actions/upload-artifact@v7
        with:
          name: fmmatchlens-preview-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: artifacts/
