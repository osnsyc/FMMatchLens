name: Feature request
description: Suggest new collected data, analysis views, or engineering improvements
title: "[Feature]: "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Use case
      description: What problem would you like to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the expected behavior, interaction, or data source.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What alternatives have you considered?
  - type: checkboxes
    id: scope
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and found no duplicate request.
          required: true
